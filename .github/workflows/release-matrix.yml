name: Supported Obsidian matrix

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app-version: latest
            installer-version: latest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OBSIDIAN_APP_VERSION: ${{ matrix.app-version }}
      OBSIDIAN_INSTALLER_VERSION: ${{ matrix.installer-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:e2e

  mobile-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm verify:release
      - run: pnpm test:performance
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:storybook
      - name: Run mobile Obsidian E2E
        env:
          OBSIDIAN_E2E_PROFILE: mobile
        run: xvfb-run -a pnpm test:e2e:run
