name: Preview release
run-name: Preview ${{ inputs.bump }} release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable semantic-version increment.
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ inputs.bump }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Compute release
        id: release
        run: |
          set -euo pipefail
          next_tag="$(python3 .github/scripts/compute_release_version.py --bump "$BUMP")"
          previous_tag="$(python3 .github/scripts/compute_release_version.py --bump "$BUMP" --previous)"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          NEXT_TAG: ${{ steps.release.outputs.next_tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        run: |
          set -euo pipefail
          range=()
          if [[ -n "$PREVIOUS_TAG" ]]; then
            range=("$PREVIOUS_TAG..HEAD")
          fi
          git-cliff "${range[@]}" --tag "$NEXT_TAG" --output release-notes.md
          {
            echo '# Release preview'
            echo
            echo "- Bump: \`$BUMP\`"
            echo "- Previous tag: \`${PREVIOUS_TAG:-none}\`"
            echo "- Next tag: \`$NEXT_TAG\`"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"
