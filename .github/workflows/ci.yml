name: CI

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complete-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_call" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_call" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" != "pull_request" ]] || ! changed_paths="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"; then
            echo "::warning::Unable to classify changed paths; running the full gate."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "reason=classification-failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$changed_paths" ]]; then
            echo "::warning::The pull request diff is empty; running the full gate."
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "reason=empty-diff" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          run_full=false
          while IFS= read -r path; do
            case "$path" in
              README.md|CONTEXT.md|docs/**|skills/**)
                ;;
              *)
                run_full=true
                break
                ;;
            esac
          done <<< "$changed_paths"

          echo "run_full=$run_full" >> "$GITHUB_OUTPUT"
          if [[ "$run_full" == "true" ]]; then
            echo "reason=runtime-or-tooling-change" >> "$GITHUB_OUTPUT"
          else
            echo "reason=documentation-or-skill-change" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip full gate for documentation-only changes
        if: steps.changes.outputs.run_full != 'true'
        run: echo "Skipping the full gate for ${{ steps.changes.outputs.reason }}."
      - if: steps.changes.outputs.run_full == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - if: steps.changes.outputs.run_full == 'true'
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.run_full == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Cache Playwright browsers
        if: steps.changes.outputs.run_full == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-
      - if: steps.changes.outputs.run_full == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.changes.outputs.run_full == 'true'
        run: pnpm test:release-helper
      - if: >-
          steps.changes.outputs.run_full == 'true'
          && (github.event_name == 'workflow_call'
          || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
          )
        run: pnpm test:cli:install
      - if: steps.changes.outputs.run_full == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: >-
          steps.changes.outputs.run_full == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.user.login != 'dependabot[bot]'
        run: xvfb-run -a pnpm check
      - if: >-
          steps.changes.outputs.run_full == 'true'
          && (github.event_name == 'workflow_call'
          || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
          )
        run: xvfb-run -a pnpm check:full
      - name: Run Dependabot mobile Obsidian E2E
        if: >-
          steps.changes.outputs.run_full == 'true'
          && github.event_name == 'pull_request'
          && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          OBSIDIAN_E2E_PROFILE: mobile
        run: xvfb-run -a pnpm test:e2e:run
