name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Stable semantic-version increment.
        required: true
        default: minor
        type: choice
        options: [patch, minor, major]

concurrency:
  group: release-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
        run: test "$SELECTED_BRANCH" = "$DEFAULT_BRANCH"

  validate:
    needs: guard
    uses: ./.github/workflows/ci.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compute and validate release
        id: release
        run: |
          set -euo pipefail
          next_tag="$(python3 .github/scripts/compute_release_version.py \
            --bump "$BUMP" \
            --require-new-commits \
            --require-absent-tag \
            --require-plugin-version)"
          previous_tag="$(python3 .github/scripts/compute_release_version.py --bump "$BUMP" --previous)"
          echo "next_tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          NEXT_TAG: ${{ steps.release.outputs.next_tag }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release ${NEXT_TAG#v}"
          git push origin "$NEXT_TAG"
          echo "RELEASE_TAG=$NEXT_TAG" >> "$GITHUB_ENV"
          {
            echo '# Release tag created'
            echo
            echo "- Previous tag: \`${PREVIOUS_TAG:-none}\`"
            echo "- Tag: \`$NEXT_TAG\`"
            echo "- Commit: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm test:performance
      - run: pnpm build
      - run: pnpm package:release
      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.next_tag }}
        run: |
          set -euo pipefail
          notes_path="${RUNNER_TEMP}/release-notes.md"
          git-cliff --current --output "$notes_path"
          {
            echo '# Release Notes'
            echo
            cat "$notes_path"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.next_tag }}
          name: ${{ steps.release.outputs.next_tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
